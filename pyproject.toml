[project]
name = "bellwether"
version = "0.1.0"
description = "Diagnose US electricity demand anomalies against evidence computed from stored grid and weather history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vyask21" }]
keywords = ["forecasting", "electricity", "time-series", "energy", "eia", "noaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # DuckDB requires pytz to hand TIMESTAMPTZ values back to Python.
    "pytz>=2024.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Repository = "https://github.com/vyask21/bellwether"

[project.optional-dependencies]
forecast = [
    "torch>=2.4.0",
    "chronos-forecasting>=1.4.0",
    "statsforecast>=1.7.0",
    # TimesFM's torch build. The `flax` extra pulls jax[cuda] instead, which is the thing
    # this machine cannot support; `[torch]` adds the package alone and reuses the torch
    # that Chronos already needs.
    "timesfm[torch]>=2.0.2",
]
# Reading NDFD forecast temperature, and nothing else in this project, needs a GRIB2
# decoder. NOAA recommends `grib2io`, which has no Windows wheel and fails to build from
# source here; `eccodes` publishes one that carries the ECMWF library with it. Optional
# because a checkout that never touches forecast weather should not compile anything.
ndfd = [
    "eccodes>=2.47.0",
]
# The local development renderer. The published Space is static HTML and installs nothing
# at all, so this is what `streamlit run dashboard/app.py` needs and nothing else.
dashboard = [
    "streamlit>=1.40.0",
    "altair>=5.4.0",
]
# Only needed to build and publish the Space, never to read it. Jinja2 and markdown-it-py
# are named rather than inherited because `build_static_space.py` imports them directly,
# and a dependency arrived at by accident is one that can vanish by accident.
#
# The dashboard extra is required, not optional: the builder imports `loaders.py` and
# `viz.py`, which import Streamlit and Altair at module scope. That the published page
# installs nothing does not help the machine doing the building. This was latent until
# 2026-08-22, because the publish step skipped for want of a credential and so never
# reached the import.
deploy = [
    "bellwether[dashboard]",
    "huggingface_hub>=1.0.0",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "respx>=0.21.0",
]

[project.scripts]
bellwether = "bellwether.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellwether"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
