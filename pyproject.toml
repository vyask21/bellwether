[project]
name = "bellwether"
version = "0.1.0"
description = "Probabilistic load forecasting for the US grid, with an evidence-grounded explanation layer."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # DuckDB requires pytz to hand TIMESTAMPTZ values back to Python.
    "pytz>=2024.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
forecast = [
    "torch>=2.4.0",
    "chronos-forecasting>=1.4.0",
    "statsforecast>=1.7.0",
]
# The dashboard runs on the committed results and snapshot alone, so it needs neither the
# forecast extra nor DuckDB. Kept separate so the Space installs a small tree.
dashboard = [
    "streamlit>=1.40.0",
    "altair>=5.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "respx>=0.21.0",
]

[project.scripts]
bellwether = "bellwether.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellwether"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
